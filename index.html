<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뉴웨이브 청년1부 사랑방 출석체크</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f9fafb; min-height:100vh; }
    .hidden { display:none !important; }

    .header { background:#fff; border-bottom:1px solid #e5e7eb; padding:1.25rem 1rem; position:sticky; top:0; z-index:100; }
    .header-content { max-width:1200px; margin:0 auto; position:relative; }
    h1 { font-size:1.5rem; color:#111827; }
    .subtitle { color:#6b7280; font-size:0.9rem; font-weight:800; margin-top:0.35rem; }
    .admin-button { position:absolute; top:0; right:0; background:#6b7280; color:#fff; padding:0.5rem 1rem; border-radius:0.85rem; border:none; cursor:pointer; font-size:0.875rem; font-weight:900; }
    .container { max-width:1200px; margin:0 auto; padding:1.5rem 1rem; }

    .team-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1rem; }
    .team-card { background:#fff; padding:1.5rem; border-radius:0.95rem; border:2px solid #e5e7eb; cursor:pointer; transition:all .2s; }
    .team-card:hover { border-color:#2563eb; box-shadow:0 10px 15px -3px rgba(0,0,0,.1); }
    .team-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem; }
    .team-number { width:2.5rem; height:2.5rem; background:#dbeafe; border-radius:0.9rem; display:flex; align-items:center; justify-content:center; color:#2563eb; font-weight:950; font-size:1rem; }
    .team-name { font-size:1.65rem; font-weight:950; color:#111827; margin-bottom:.25rem; }
    .team-leader { font-size:.9rem; color:#6b7280; font-weight:800; }
    .member-count { background:#f3f4f6; padding:.25rem .75rem; border-radius:9999px; font-size:.875rem; color:#6b7280; font-weight:900; }
    .back-button { display:flex; align-items:center; gap:.5rem; color:#6b7280; background:none; border:none; cursor:pointer; font-size:1rem; padding:.5rem .25rem; font-weight:900; }

    .date-section { background:#fff; padding:1rem; border-radius:.95rem; border:1px solid #e5e7eb; margin-bottom:1rem; }
    .date-row { display: flex; gap: 0.5rem; align-items: center; }
    .date-label { font-size:.875rem; font-weight:950; color:#374151; margin-bottom:.5rem; }
    .date-input { flex: 1; padding:.75rem 1rem; border:1px solid #d1d5db; border-radius:.9rem; font-size:16px; background:#fff; display: block; }
    
    /* 불러오기 버튼 스타일 */
    .load-button { background:#4b5563; color:white; border:none; padding:0 1.2rem; border-radius:.9rem; font-weight:900; cursor:pointer; font-size:0.9rem; transition: background 0.2s; }
    .load-button:hover { background:#374151; }
    .load-button:active { transform: scale(0.98); }

    .summary-box { background:#eff6ff; padding:1rem; border-radius:.95rem; border:1px solid #bfdbfe; margin-bottom:1rem; }
    .summary-content { display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem; }
    .summary-title { font-weight:950; color:#111827; }
    .summary-count { font-size:1.5rem; font-weight:950; color:#2563eb; }
    .progress-bar { background:#e5e7eb; border-radius:9999px; height:.5rem; overflow:hidden; }
    .progress-fill { background:#2563eb; height:100%; transition:width .3s; }
    .search-input { width:100%; padding:.65rem .9rem; border:1px solid #d1d5db; border-radius:.9rem; font-size:16px; margin-bottom: 1rem; }
    
    .member-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:.75rem; margin-bottom:1rem; }
    .member-item { background:#fff; padding:.9rem; border-radius:.95rem; border:2px solid #e5e7eb; transition:all .2s; }
    .member-item.checked { background:#eff6ff; border-color:#2563eb; }
    .member-header { display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer; gap:.5rem; }
    .member-name { font-size:1rem; font-weight:950; color:#374151; }
    .member-meta { margin-top:.2rem; font-size:.85rem; font-weight:900; color:#6b7280; }
    .checkbox { width:1.75rem; height:1.75rem; border-radius:9999px; border:2px solid #d1d5db; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:.1rem; }
    .member-item.checked .checkbox { background:#2563eb; border-color:#2563eb; }
    .checkmark { display:none; color:#fff; font-weight:950; font-size:.95rem; }
    .member-item.checked .checkmark { display:block; }
    .note-section { margin-top:.75rem; padding-top:.75rem; border-top:1px solid #e5e7eb; }
    .note-input { width:100%; padding:.55rem .65rem; border:1px solid #d1d5db; border-radius:.85rem; font-size:16px; }
    .suggestion-textarea { width:100%; padding:.75rem; border:1px solid #d1d5db; border-radius:.9rem; font-size:16px; min-height:90px; }
    
    .sticky-actions { position:sticky; bottom:0; background:rgba(249,250,251,.95); border-top:1px solid #e5e7eb; padding:.75rem 0 1rem 0; backdrop-filter:blur(6px); }
    .save-button { width:100%; background:#2563eb; color:#fff; padding:.95rem; border-radius:.95rem; border:none; font-size:1.05rem; font-weight:950; cursor:pointer; }
    .message { padding:.85rem 1rem; border-radius:.95rem; text-align:center; font-weight:950; margin-top:.75rem; }
    .message.success { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .message.error { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .message.info { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }

    .dashboard-tabs { display:flex; gap:1rem; margin-bottom:1.25rem; border-bottom:2px solid #e5e7eb; overflow-x:auto; }
    .tab-button { padding:0.75rem 1.25rem; font-size:1rem; background:none; border:none; cursor:pointer; color:#6b7280; border-bottom:2px solid transparent; margin-bottom:-2px; font-weight:950; white-space:nowrap; }
    .tab-button.active { color:#2563eb; border-bottom-color:#2563eb; }
    .admin-summary { display:grid; grid-template-columns:repeat(3, 1fr); gap:.75rem; margin:1rem 0; }
    .admin-summary-card { background:#fff; border:1px solid #e5e7eb; border-radius:.95rem; padding:1rem; }
    .admin-summary-value { font-size:1.6rem; font-weight:950; color:#111827; }
    .admin-summary-label { font-size:.875rem; color:#6b7280; font-weight:950; }

    .attendance-table { background:#fff; border-radius:.95rem; border:1px solid #e5e7eb; overflow-x: auto; }
    table { width:100%; border-collapse:collapse; }
    th { background:#f9fafb; padding:1rem; text-align:left; font-size:.95rem; font-weight:950; border-bottom:1px solid #e5e7eb; white-space:nowrap; }
    td { padding:1rem; border-bottom:1px solid #e5e7eb; font-size:.95rem; vertical-align:middle; white-space:nowrap; }
    
    .team-row { cursor: pointer; transition: background 0.2s; }
    .team-row:hover { background: #f3f4f6; }
    .team-row.unsubmitted { background:#fff; opacity:0.8; }
    .team-row.unsubmitted td { color:#6b7280; }
    .status-badge { display:inline-block; padding:.2rem .5rem; border-radius:4px; font-size:0.75rem; font-weight:bold; }
    .status-ok { background:#dcfce7; color:#166534; }
    .status-no { background:#fee2e2; color:#991b1b; }

    .detail-row td { padding: 0 !important; background: #fafafa; border-bottom: 1px solid #e5e7eb; }
    .detail-panel { padding: 1.5rem; }
    .detail-grid { display:grid; gap:1rem; grid-template-columns:1fr; }
    @media (min-width:768px){ .detail-grid { grid-template-columns: 1fr 1fr; } }
    .detail-box { background:#fff; border:1px solid #e5e7eb; border-radius:.75rem; padding:1rem; }
    .detail-header { font-weight:950; color:#111827; margin-bottom:.75rem; border-bottom:1px solid #f3f4f6; padding-bottom:.5rem; }
    .chips { display:flex; flex-wrap:wrap; gap:.5rem; }
    .chip { padding:.3rem .7rem; border-radius:999px; font-size:.8rem; font-weight:800; background:#eff6ff; color:#1e40af; }
    .chip.absent { background:#fef2f2; color:#991b1b; }
    .chart-card { background:#fff; border:1px solid #e5e7eb; border-radius:.95rem; padding:1rem; margin-top:.75rem; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:999; }
    .modal { background:#fff; width:90%; max-width:400px; padding:1.5rem; border-radius:1rem; }
    .modal-actions { display:flex; gap:0.5rem; margin-top:1rem; }
    .modal-btn { flex:1; padding:0.8rem; border-radius:0.5rem; border:none; font-weight:bold; cursor:pointer; }
    .modal-btn.primary { background:#2563eb; color:#fff; }
  </style>
</head>

<body>
  <div id="homePage">
    <div class="header">
      <div class="header-content">
        <button type="button" class="admin-button" id="adminBtn">관리자</button>
        <h1>뉴웨이브 청년1부</h1>
        <p class="subtitle">출석 체크를 위해 사랑방을 선택해주세요</p>
      </div>
    </div>
    <div class="container">
      <div class="team-grid" id="teamGrid"></div>
    </div>
  </div>

  <div id="attendancePage" class="hidden">
    <div class="header">
      <div class="header-content">
        <button type="button" class="back-button" id="teamBackBtn">← 뒤로가기</button>
        <h1 id="selectedTeamName"></h1>
        <p class="subtitle" id="selectedTeamLeader"></p>
      </div>
    </div>
    <div class="container">
      <div class="date-section">
        <div class="date-label">날짜 선택</div>
        <div class="date-row">
          <input type="date" class="date-input" id="dateInput" />
          <button type="button" class="load-button" id="forceLoadBtn">불러오기</button>
        </div>
      </div>
      <div class="summary-box">
        <div class="summary-content">
          <span class="summary-title">출석률</span>
          <span class="summary-count" id="attendanceCount">0 / 0</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <input id="memberSearch" class="search-input" placeholder="이름 검색..." />
      <div class="member-list" id="memberList"></div>
      <div class="suggestion-section" style="margin-bottom:1rem;">
        <div class="date-label">건의사항 (선택)</div>
        <textarea class="suggestion-textarea" id="suggestionInput" placeholder="건의사항을 입력하세요"></textarea>
      </div>
      <div class="sticky-actions">
        <button type="button" class="save-button" id="saveBtn">출석 정보 저장</button>
        <div id="messageBox" class="hidden"></div>
      </div>
    </div>
  </div>

  <div id="adminDashboard" class="hidden">
    <div class="header">
      <div class="header-content">
        <button type="button" class="back-button" id="adminBackBtn">← 홈으로</button>
        <h1>관리자 대시보드</h1>
      </div>
    </div>
    <div class="container">
      <div class="dashboard-tabs">
        <button class="tab-button active" data-tab="stats">출석 현황</button>
        <button class="tab-button" data-tab="notes">특이사항</button>
        <button class="tab-button" data-tab="suggestions">건의사항</button> <button class="tab-button" data-tab="members">개인별 조회</button>
      </div>

      <div id="adminStatsTab">
        <div class="date-section">
          <div class="date-label">날짜 확인</div>
          <input type="date" class="date-input" id="adminDateInput" />
        </div>
        <div class="admin-summary">
          <div class="admin-summary-card">
            <div class="admin-summary-label">출석</div>
            <div class="admin-summary-value" id="adminTotalPresent">0</div>
          </div>
          <div class="admin-summary-card">
            <div class="admin-summary-label">결석</div>
            <div class="admin-summary-value" id="adminTotalAbsent">0</div>
          </div>
          <div class="admin-summary-card">
            <div class="admin-summary-label">출석률</div>
            <div class="admin-summary-value" id="adminTotalRate">0%</div>
          </div>
        </div>
        <div class="attendance-table" id="attendanceTable"></div>
      </div>

      <div id="adminNotesTab" class="hidden">
        <div class="date-section">
           <div class="date-label">날짜 확인</div>
           <input type="date" class="date-input" id="adminNotesDateInput" />
        </div>
        <div class="attendance-table" id="notesTable" style="padding:1rem;"></div>
      </div>
      
      <div id="adminSuggestionsTab" class="hidden">
        <div class="date-section">
           <div class="date-label">날짜 확인</div>
           <input type="date" class="date-input" id="adminSuggestionsDateInput" />
        </div>
        <div class="attendance-table" id="suggestionsTable" style="padding:1rem;"></div>
      </div>

      <div id="adminMembersTab" class="hidden">
        <div class="date-section">
          <div class="date-label">기간 및 대상 설정</div>
          <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem;">
            <input type="date" class="date-input" id="memberStartDate" style="flex: 1; width: auto;" />
            <input type="date" class="date-input" id="memberEndDate" style="flex: 1; width: auto;" />
          </div>
          <select class="date-input" id="memberSelect" style="margin-bottom:0.5rem;">
            <option value="">사람 선택</option>
          </select>
          <button type="button" class="save-button" id="saveToSheetBtn" style="background:#059669; margin-top:0.5rem;">
            📊 구글 시트에 기간별 통계 저장
          </button>
        </div>
        <div id="memberResultArea" class="hidden">
           <div class="admin-summary">
            <div class="admin-summary-card">
              <div class="admin-summary-label">출석 횟수</div>
              <div class="admin-summary-value" id="memPresent">0</div>
            </div>
            <div class="admin-summary-card">
              <div class="admin-summary-label">총 횟수</div>
              <div class="admin-summary-value" id="memTotal">0</div>
            </div>
            <div class="admin-summary-card">
              <div class="admin-summary-label">출석률</div>
              <div class="admin-summary-value" id="memRate">0%</div>
            </div>
          </div>
          <div class="chart-card">
            <canvas id="memberChart" style="width:100%; height:250px;"></canvas>
          </div>
          <div class="attendance-table" id="memberHistoryTable" style="margin-top:1rem;"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="passwordModal" class="modal-overlay hidden">
    <div class="modal">
      <h3 style="margin-bottom:0.5rem; font-size:1.2rem;">비밀번호 입력</h3>
      <p id="modalSubtitle" style="margin-bottom:1rem; color:#666; font-size:0.9rem;"></p>
      <input type="password" id="modalPassword" class="date-input" placeholder="비밀번호" />
      <div id="modalError" style="color:red; font-size:0.9rem; margin-top:0.5rem;" class="hidden"></div>
      <div class="modal-actions">
        <button class="modal-btn" style="background:#f3f4f6;" id="modalCancelBtn">취소</button>
        <button class="modal-btn primary" id="modalOkBtn">확인</button>
      </div>
    </div>
  </div>

    // ✅ 또래 정규화 (한 자리 숫자는 자동으로 0을 붙임)
    function normalizeCohort(value) {
        let cohortStr = (value || "").toString().trim();
        cohortStr = cohortStr.replace(/'/g, ""); // 따옴표 제거
        
        // 한 자리 숫자(0~9)인 경우 앞에 0을 붙여 00~09로 정규화
        if (/^\d$/.test(cohortStr)) {
            return '0' + cohortStr;
        }
        return cohortStr;
    }

    function jsonp(url, params) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Date.now() + Math.floor(Math.random()*1000);
        params.callback = cb;
        const query = Object.keys(params).map(k => encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
        const script = document.createElement("script");
        script.src = url + "?" + query;
        window[cb] = (data) => { delete window[cb]; document.body.removeChild(script); resolve(data); };
        script.onerror = () => { delete window[cb]; if(script.parentNode) document.body.removeChild(script); reject("Network Error"); };
        document.body.appendChild(script);
      });
    }

    async function loadServerAttendance() {
      showMsg("info", "데이터 불러오는 중...");
      try {
        const res = await jsonp(GOOGLE_SCRIPT_URL, { 
          action: "loadAttendance", teamId: selectedTeam.id, date: document.getElementById("dateInput").value 
        });
        
        // 1. 초기화
        const items = document.querySelectorAll(".member-item");
        items.forEach(el => {
          const key = el.dataset.key;
          attendance[key] = false;
          el.classList.remove("checked");
          el.querySelector(".note-input").value = "";
          memberNotes[key] = "";
        });
        document.getElementById("suggestionInput").value = "";

        // 2. 서버 데이터 매칭 및 복원
        if (res.status === "success" && res.data.found) {
          res.data.attendance.forEach(r => {
            const serverName = r.name.trim();
            const serverCohort = normalizeCohort(r.cohort);
            const key = serverName + "||" + serverCohort;
            
            if (attendance.hasOwnProperty(key)) {
              attendance[key] = r.isPresent;
              memberNotes[key] = r.note || "";
              const el = document.querySelector(`.member-item[data-key="${key.replace(/([ #;?%&,.+*~\':"!^$[\]()=>|/@])/g,'\\$1')}"]`);
              if (el) {
                if (r.isPresent) el.classList.add("checked");
                el.querySelector(".note-input").value = r.note || "";
              }
            }
          });
          document.getElementById("suggestionInput").value = res.data.suggestion || "";
          showMsg("success", "이전 데이터를 불러왔습니다.");
        } else {
          showMsg("info", "새로운 출석체크를 시작합니다.");
        }
        updateUI();
      } catch(e) { console.error(e); showMsg("error", "데이터 로드 실패"); }
    }

    async function loadAdminStats() {
      const date = document.getElementById("adminDateInput").value;
      const container = document.getElementById("attendanceTable");
      container.innerHTML = "<div class='message info'>로딩 중...</div>";
      const totalMembers = TEAMS.reduce((sum, team) => sum + team.members.length, 0);

      try {
        const res = await jsonp(GOOGLE_SCRIPT_URL, { action: "getStatsByDate", date });
        if(res.status !== "success") throw new Error();
        
        let html = `<table><thead><tr><th>사랑방</th><th>총원</th><th>출석</th><th>결석</th><th>출석률</th></tr></thead><tbody>`;
        let tp=0; 
        const submittedData = res.data.teamStats; 

        TEAMS.forEach(team => {
          const stat = submittedData.find(s => String(s.teamId) === String(team.id));
          if (stat) {
            const present = Number(stat.present) || 0;
            const absent = Number(stat.absent) || 0; 
            const totalRecorded = present + absent; 
            const rate = totalRecorded ? Math.round(present/totalRecorded*100) : 0;
            tp += present; 
            
            html += `
              <tr class="team-row" onclick="toggleDetail(this, '${team.id}', '${date}')">
                <td><span class="status-badge status-ok">제출</span> ${team.name}</td>
                <td>${totalRecorded}</td>
                <td>${present}</td>
                <td>${absent}</td>
                <td>${rate}%</td>
              </tr>
              <tr class="detail-row hidden" id="detail-${team.id}">
                <td colspan="5"><div class="detail-panel" id="panel-${team.id}">로딩 중...</div></td>
              </tr>
            `;
          } else {
            html += `<tr class="team-row unsubmitted"><td><span class="status-badge status-no">미제출</span> ${team.name}</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>`;
          }
        });

        html += "</tbody></table>";
        container.innerHTML = html;
        const overallRate = totalMembers ? Math.round(tp/totalMembers*100)+"%" : "0%";
        const totalAbsent = totalMembers - tp;
        document.getElementById("adminTotalPresent").textContent = tp;
        document.getElementById("adminTotalAbsent").textContent = totalAbsent; 
        document.getElementById("adminTotalRate").textContent = overallRate; 
      } catch(e) { container.innerHTML = "<div class='message error'>로딩 실패</div>"; }
    }

         try {
           const res = await jsonp(GOOGLE_SCRIPT_URL, { action: "loadAttendance", teamId, date });
           if (res.status === "success" && res.data.found) {
             const att = res.data.attendance;
             const present = att.filter(x=>x.isPresent).map(x=>`<span class="chip">${x.name}</span>`).join("");
             const absent = att.filter(x=>!x.isPresent).map(x=>`<span class="chip absent">${x.name}</span>`).join("");
             const notes = att.filter(x => x.note && x.note.trim() !== "");
             let notesHtml = notes.map(n => {
                 const cohortDisplay = n.cohort ? n.cohort : '';
                 return `<div><strong>${n.name}${cohortDisplay}:</strong> ${n.note}</div>`;
             }).join("<div style='height: 4px;'></div>"); 
             panel.innerHTML = `
               <div class="detail-grid">
                 <div class="detail-box"><div class="detail-header">출석 명단</div><div class="chips">${present || "없음"}</div></div>
                 <div class="detail-box"><div class="detail-header">결석 명단</div><div class="chips">${absent || "없음"}</div></div>
               </div>
               <div class="detail-box" style="margin-top:1rem; grid-column: 1 / -1;"><div class="detail-header">방원별 특이사항</div><div style="margin-top: 0.5rem; font-size:0.9rem;">${notesHtml || "<div style='color:#6b7280;'>기록된 특이사항이 없습니다.</div>"}</div></div>`;
           } else { panel.innerHTML = "데이터 없음"; }
         } catch(e) { panel.innerHTML = "로딩 에러"; }
       } else { detailRow.classList.add("hidden"); row.style.background = ""; }
    }

    async function loadAdminNotes() {
       const date = document.getElementById("adminNotesDateInput").value;
       const div = document.getElementById("notesTable"); div.innerHTML = "로딩 중...";
       try {
         const res = await jsonp(GOOGLE_SCRIPT_URL, { action: "getNotesByDate", date });
         if (res.data.length === 0) { div.innerHTML = "<div class='message info'>특이사항 없음</div>"; return; }
         let html = `<table><thead><tr><th>사랑방</th><th>이름</th><th>또래</th><th>내용</th></tr></thead><tbody>`;
         res.data.forEach(n => html += `<tr><td>${n.teamName}</td><td>${n.name}</td><td>${n.cohort}</td><td>${n.note}</td></tr>`);
         div.innerHTML = html + "</tbody></table>";
       } catch(e) { div.innerHTML = "에러 발생"; }
    }
    document.getElementById("adminNotesDateInput").onchange = loadAdminNotes;

    async function loadAdminSuggestions() {
       const date = document.getElementById("adminSuggestionsDateInput").value;
       const div = document.getElementById("suggestionsTable"); div.innerHTML = "로딩 중...";
       try {
         const res = await jsonp(GOOGLE_SCRIPT_URL, { action: "getSuggestionsByDate", date });
         if (res.data.length === 0) { div.innerHTML = "<div class='message info'>건의사항 없음</div>"; return; }
         let html = `<table><thead><tr><th>사랑방</th><th>건의사항</th></tr></thead><tbody>`;
         res.data.forEach(s => html += `<tr><td>${s.teamName}</td><td>${s.suggestion}</td></tr>`);
         div.innerHTML = html + "</tbody></table>";
       } catch(e) { div.innerHTML = "에러 발생"; }
    }
    document.getElementById("adminSuggestionsDateInput").onchange = loadAdminSuggestions; 

    async function loadMemberList() {
       const sel = document.getElementById("memberSelect");
       if (sel.options.length > 1) return; 
       try {
         const res = await jsonp(GOOGLE_SCRIPT_URL, { action: "getAllMembers" });
         res.data.forEach(m => {
           const cohort = normalizeCohort(m.cohort);
           const opt = document.createElement("option"); 
           opt.value = m.name + "||" + cohort; 
           opt.text = `${m.name} (${cohort})`; 
           sel.appendChild(opt);
         });
       } catch(e) {}
    }
    document.getElementById("memberSelect").onchange = async (e) => {
       const val = e.target.value;
       const area = document.getElementById("memberResultArea");
       if (!val) { area.classList.add("hidden"); return; }
       area.classList.remove("hidden");
       const [name, cohort] = val.split("||");
       const res = await jsonp(GOOGLE_SCRIPT_URL, { action: "getMemberHistory", name, cohort, startDate: document.getElementById("memberStartDate").value, endDate: document.getElementById("memberEndDate").value });
       if (res.status === "success") {
         const d = res.data;
         document.getElementById("memPresent").textContent = d.present;
         document.getElementById("memTotal").textContent = d.total;
         document.getElementById("memRate").textContent = d.total ? ((d.present/d.total)*100).toFixed(0)+"%" : "0%";
         let html = `<table><thead><tr><th>날짜</th><th>소속</th><th>출석여부</th><th>특이사항</th></tr></thead><tbody>`;
         d.sessions.forEach(s => html += `<tr><td>${s.date}</td><td>${s.teamName}</td><td style="color:${s.isPresent?'green':'red'}">${s.isPresent?'출석':'결석'}</td><td>${s.note}</td></tr>`);
         document.getElementById("memberHistoryTable").innerHTML = html + "</tbody></table>";
         renderChart(d.monthly);
       }
    };
    function renderChart(monthlyData) {
      const ctx = document.getElementById("memberChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels: monthlyData.map(d=>d.month), datasets: [{ label: '월별 출석률 (%)', data: monthlyData.map(d=>parseFloat(d.rate)), backgroundColor: '#3b82f6', borderRadius: 5 }] },
        options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
      });
    }
    
    // ✅ 수정된 기능: 구글 시트로 저장하기
    document.getElementById("saveToSheetBtn").onclick = async () => {
      const btn = document.getElementById("saveToSheetBtn");
      
      // input 필드에서 가져온 날짜 값을 Date 객체로 변환
      const startRaw = document.getElementById("memberStartDate").value;
      const endRaw = document.getElementById("memberEndDate").value;
      
      if (!startRaw || !endRaw) {
        alert("시작일과 종료일을 모두 선택해주세요.");
        return;
      }
    
      // 이 부분이 핵심입니다: 이전과 동일한 ISO 형식(2026-02-03T13:29:57.618Z)으로 변환
      const isoStartDate = new Date(startRaw).toISOString();
      const isoEndDate = new Date(endRaw).toISOString();
    
      if (!confirm(`${startRaw}부터 ${endRaw}까지의 통계를\n구글 스프레드시트의 새 탭으로 저장하시겠습니까?`)) return;
    
      btn.disabled = true;
      btn.textContent = "저장 중... (잠시만 기다려주세요)";
      
      try {
        const res = await jsonp(GOOGLE_SCRIPT_URL, { 
          action: "saveSummaryToSheet", 
          startDate: isoStartDate, // 변환된 ISO 형식 전송
          endDate: isoEndDate     // 변환된 ISO 형식 전송
        });
        
        if (res.status === "success") {
          alert("성공!\n" + res.message);
        } else {
          alert("오류 발생: " + res.message);
        }
      } catch(e) {
        console.error(e);
        alert("저장 중 네트워크 오류가 발생했습니다.");
      } finally {
        btn.disabled = false;
        btn.textContent = "📊 구글 시트에 기간별 통계 저장";
      }
    };
  </script>
</body>
</html>
