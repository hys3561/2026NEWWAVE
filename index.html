<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뉴웨이브 청년1부 사랑방 출석체크</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f9fafb; min-height:100vh; }
    .hidden { display:none !important; }

    .header { background:#fff; border-bottom:1px solid #e5e7eb; padding:1.25rem 1rem; position:sticky; top:0; z-index:100; }
    .header-content { max-width:1200px; margin:0 auto; position:relative; }
    h1 { font-size:1.5rem; color:#111827; }
    .subtitle { color:#6b7280; font-size:0.9rem; font-weight:800; margin-top:0.35rem; }
    .admin-button { position:absolute; top:0; right:0; background:#6b7280; color:#fff; padding:0.5rem 1rem; border-radius:0.85rem; border:none; cursor:pointer; font-size:0.875rem; font-weight:900; }
    .container { max-width:1200px; margin:0 auto; padding:1.5rem 1rem; }

    .team-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1rem; }
    .team-card { background:#fff; padding:1.5rem; border-radius:0.95rem; border:2px solid #e5e7eb; cursor:pointer; transition:all .2s; }
    .team-card:hover { border-color:#2563eb; box-shadow:0 10px 15px -3px rgba(0,0,0,.1); }
    .team-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem; }
    .team-number { width:2.5rem; height:2.5rem; background:#dbeafe; border-radius:0.9rem; display:flex; align-items:center; justify-content:center; color:#2563eb; font-weight:950; font-size:1rem; }
    .team-name { font-size:1.65rem; font-weight:950; color:#111827; margin-bottom:.25rem; }
    .team-leader { font-size:.9rem; color:#6b7280; font-weight:800; }
    .member-count { background:#f3f4f6; padding:.25rem .75rem; border-radius:9999px; font-size:.875rem; color:#6b7280; font-weight:900; }
    .back-button { display:flex; align-items:center; gap:.5rem; color:#6b7280; background:none; border:none; cursor:pointer; font-size:1rem; padding:.5rem .25rem; font-weight:900; }

    .date-section { background:#fff; padding:1rem; border-radius:.95rem; border:1px solid #e5e7eb; margin-bottom:1rem; }
    .date-row { display: flex; gap: 0.5rem; align-items: center; }
    .date-label { font-size:.875rem; font-weight:950; color:#374151; margin-bottom:.5rem; }
    .date-input { flex: 1; padding:.75rem 1rem; border:1px solid #d1d5db; border-radius:.9rem; font-size:16px; background:#fff; display: block; }
    
    /* 불러오기 버튼 스타일 */
    .load-button { background:#4b5563; color:white; border:none; padding:0 1.2rem; border-radius:.9rem; font-weight:900; cursor:pointer; font-size:0.9rem; transition: background 0.2s; }
    .load-button:hover { background:#374151; }
    .load-button:active { transform: scale(0.98); }

    .summary-box { background:#eff6ff; padding:1rem; border-radius:.95rem; border:1px solid #bfdbfe; margin-bottom:1rem; }
    .summary-content { display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem; }
    .summary-title { font-weight:950; color:#111827; }
    .summary-count { font-size:1.5rem; font-weight:950; color:#2563eb; }
    .progress-bar { background:#e5e7eb; border-radius:9999px; height:.5rem; overflow:hidden; }
    .progress-fill { background:#2563eb; height:100%; transition:width .3s; }
    .search-input { width:100%; padding:.65rem .9rem; border:1px solid #d1d5db; border-radius:.9rem; font-size:16px; margin-bottom: 1rem; }
    
    .member-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:.75rem; margin-bottom:1rem; }
    .member-item { background:#fff; padding:.9rem; border-radius:.95rem; border:2px solid #e5e7eb; transition:all .2s; }
    .member-item.checked { background:#eff6ff; border-color:#2563eb; }
    .member-header { display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer; gap:.5rem; }
    .member-name { font-size:1rem; font-weight:950; color:#374151; }
    .member-meta { margin-top:.2rem; font-size:.85rem; font-weight:900; color:#6b7280; }
    .checkbox { width:1.75rem; height:1.75rem; border-radius:9999px; border:2px solid #d1d5db; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:.1rem; }
    .member-item.checked .checkbox { background:#2563eb; border-color:#2563eb; }
    .checkmark { display:none; color:#fff; font-weight:950; font-size:.95rem; }
    .member-item.checked .checkmark { display:block; }
    .note-section { margin-top:.75rem; padding-top:.75rem; border-top:1px solid #e5e7eb; }
    .note-input { width:100%; padding:.55rem .65rem; border:1px solid #d1d5db; border-radius:.85rem; font-size:16px; }
    .suggestion-textarea { width:100%; padding:.75rem; border:1px solid #d1d5db; border-radius:.9rem; font-size:16px; min-height:90px; }
    
    .sticky-actions { position:sticky; bottom:0; background:rgba(249,250,251,.95); border-top:1px solid #e5e7eb; padding:.75rem 0 1rem 0; backdrop-filter:blur(6px); }
    .save-button { width:100%; background:#2563eb; color:#fff; padding:.95rem; border-radius:.95rem; border:none; font-size:1.05rem; font-weight:950; cursor:pointer; }
    .message { padding:.85rem 1rem; border-radius:.95rem; text-align:center; font-weight:950; margin-top:.75rem; }
    .message.success { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .message.error { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .message.info { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }

    .dashboard-tabs { display:flex; gap:1rem; margin-bottom:1.25rem; border-bottom:2px solid #e5e7eb; overflow-x:auto; overflow-y:visible; padding-top:8px; }
    .tab-button { padding:0.75rem 1.25rem; font-size:1rem; background:none; border:none; cursor:pointer; color:#6b7280; border-bottom:2px solid transparent; margin-bottom:-2px; font-weight:950; white-space:nowrap; }
    .tab-button.active { color:#2563eb; border-bottom-color:#2563eb; }
    .admin-summary { display:grid; grid-template-columns:repeat(3, 1fr); gap:.75rem; margin:1rem 0; }
    .admin-summary-card { background:#fff; border:1px solid #e5e7eb; border-radius:.95rem; padding:1rem; }
    .admin-summary-value { font-size:1.6rem; font-weight:950; color:#111827; }
    .admin-summary-label { font-size:.875rem; color:#6b7280; font-weight:950; }

    .attendance-table { background:#fff; border-radius:.95rem; border:1px solid #e5e7eb; overflow-x: auto; }
    table { width:100%; border-collapse:collapse; }
    th { background:#f9fafb; padding:.75rem 1rem; text-align:left; font-size:.875rem; font-weight:950; border-bottom:1px solid #e5e7eb; white-space:nowrap; }
    td { padding:.75rem 1rem; border-bottom:1px solid #e5e7eb; font-size:.9rem; vertical-align:top; white-space:normal; word-break:break-word; }

    /* 출석현황 테이블 */
    .stats-table { table-layout:fixed; width:100%; }
    .stats-table th, .stats-table td { font-size:.95rem; padding:.9rem .75rem; vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stats-table th:first-child, .stats-table td:first-child { width:45%; }
    .stats-table th:not(:first-child), .stats-table td:not(:first-child) { width:13.75%; text-align:center; }
    .team-name-cell { display:inline-flex; align-items:center; gap:.4rem; white-space:nowrap; max-width:100%; overflow:hidden; }
    @media (max-width:640px) {
      .stats-table th, .stats-table td { font-size:.82rem; padding:.6rem .45rem; }
    }
    /* 토글 패널 */
    .detail-row td { padding:0 !important; background:#fafafa; border-bottom:1px solid #e5e7eb; white-space:normal; word-break:break-word; }
    .detail-panel { padding:.75rem; box-sizing:border-box; }

    /* 특이사항·건의사항 카드 */
    .note-card { padding:.85rem 1rem; border-bottom:1px solid #f3f4f6; display:flex; gap:.75rem; align-items:flex-start; }
    .note-card:last-child { border-bottom:none; }
    .note-team-badge {
      flex-shrink:0;
      background:#eff6ff; color:#1e40af;
      font-size:.75rem; font-weight:900;
      padding:.25rem .5rem; border-radius:.5rem;
      text-align:center; line-height:1.3;
      max-width:5.5rem; word-break:keep-all;
    }
    .note-body { flex:1; min-width:0; }
    .note-person { font-weight:900; font-size:.9rem; color:#111827; }
    .note-cohort { font-size:.78rem; color:#9ca3af; margin-left:.3rem; }
    .note-text { margin-top:.3rem; font-size:.88rem; color:#374151; white-space:pre-wrap; word-break:break-word; line-height:1.55; }
    .sugg-card { padding:.85rem 1rem; border-bottom:1px solid #f3f4f6; display:flex; gap:.75rem; align-items:flex-start; }
    .sugg-card:last-child { border-bottom:none; }
    .sugg-text { flex:1; font-size:.9rem; color:#374151; white-space:pre-wrap; word-break:break-word; line-height:1.55; }
    
    .team-row { cursor: pointer; transition: background 0.2s; }
    .team-row:hover { background: #f3f4f6; }
    .team-row.unsubmitted { background:#fff; opacity:0.8; }
    .team-row.unsubmitted td { color:#6b7280; }
    .status-badge { display:inline-block; padding:.2rem .5rem; border-radius:4px; font-size:0.75rem; font-weight:bold; }
    .status-ok { background:#dcfce7; color:#166534; }
    .status-no { background:#fee2e2; color:#991b1b; }

    .detail-row td { padding: 0 !important; background: #fafafa; border-bottom: 1px solid #e5e7eb; white-space:normal; word-break:break-word; }
    .detail-panel { padding: 1rem; max-width:100%; overflow-x:hidden; }
    .detail-grid { display:grid; gap:1rem; grid-template-columns:1fr; min-width:0; }
    @media (min-width:768px){ .detail-grid { grid-template-columns: 1fr 1fr; } }
    .detail-box { background:#fff; border:1px solid #e5e7eb; border-radius:.75rem; padding:1rem; min-width:0; overflow:hidden; word-break:break-word; }
    .detail-header { font-weight:950; color:#111827; margin-bottom:.75rem; border-bottom:1px solid #f3f4f6; padding-bottom:.5rem; }
    .chips { display:flex; flex-wrap:wrap; gap:.5rem; }
    .chip { padding:.3rem .7rem; border-radius:999px; font-size:.8rem; font-weight:800; background:#eff6ff; color:#1e40af; }
    .chip.absent { background:#fef2f2; color:#991b1b; }
    .chart-card { background:#fff; border:1px solid #e5e7eb; border-radius:.95rem; padding:1rem; margin-top:.75rem; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:999; }
    .modal { background:#fff; width:90%; max-width:400px; padding:1.5rem; border-radius:1rem; }
    .modal-actions { display:flex; gap:0.5rem; margin-top:1rem; }
    .modal-btn { flex:1; padding:0.8rem; border-radius:0.5rem; border:none; font-weight:bold; cursor:pointer; }
    .modal-btn.primary { background:#2563eb; color:#fff; }

    /* 날짜 단축 버튼 바 */
    .date-shortcut-bar { display:flex; flex-wrap:wrap; gap:.5rem; padding:.75rem 1rem; background:#f8fafc; border-bottom:1px solid #e5e7eb; border-radius:.95rem .95rem 0 0; }
    .date-shortcut-btn {
      display:inline-flex; align-items:center; gap:.35rem;
      padding:.35rem .75rem; border-radius:999px; border:none; cursor:pointer;
      font-size:.82rem; font-weight:800; transition:all .15s;
      background:#fff; border:1px solid #d1d5db; color:#374151;
    }
    .date-shortcut-btn:hover { background:#eff6ff; border-color:#2563eb; color:#2563eb; }
    .date-shortcut-btn.active { background:#2563eb; border-color:#2563eb; color:#fff; }
    .date-shortcut-dot { width:.45rem; height:.45rem; border-radius:999px; background:#ef4444; flex-shrink:0; }
    .tab-wrap { position:relative; display:inline-flex; }
    .notif-badge {
      position:absolute; top:-6px; right:-8px;
      background:#ef4444; color:#fff;
      font-size:0.65rem; font-weight:900;
      min-width:1.1rem; height:1.1rem;
      border-radius:999px; display:flex; align-items:center; justify-content:center;
      padding:0 .25rem; border:2px solid #fff;
      pointer-events:none; z-index:10;
    }
  </style>
</head>

<body>
  <div id="homePage">
    <div class="header">
      <div class="header-content">
        <button type="button" class="admin-button" id="adminBtn">관리자</button>
        <h1>뉴웨이브 청년1부</h1>
        <p class="subtitle">출석 체크를 위해 사랑방을 선택해주세요</p>
      </div>
    </div>
    <div class="container">
      <div class="team-grid" id="teamGrid"></div>
    </div>
  </div>

  <div id="attendancePage" class="hidden">
    <div class="header">
      <div class="header-content">
        <button type="button" class="back-button" id="teamBackBtn">← 뒤로가기</button>
        <h1 id="selectedTeamName"></h1>
        <p class="subtitle" id="selectedTeamLeader"></p>
      </div>
    </div>
    <!-- 출석체크 / 통계 탭 -->
    <div style="background:#fff; border-bottom:2px solid #e5e7eb; display:flex;">
      <button class="tab-button active" id="attTabCheck" onclick="switchAttTab('check')" style="flex:1; text-align:center;">✓ 출석체크</button>
      <button class="tab-button" id="attTabStats" onclick="switchAttTab('stats')" style="flex:1; text-align:center;">📊 통계</button>
    </div>

    <!-- 출석체크 탭 -->
    <div id="attCheckPanel">
      <div class="container">
        <div class="date-section">
          <div class="date-label">날짜 선택</div>
          <div class="date-row">
            <input type="date" class="date-input" id="dateInput" />
            <button type="button" class="load-button" id="forceLoadBtn">불러오기</button>
          </div>
        </div>
        <div class="summary-box">
          <div class="summary-content">
            <span class="summary-title">출석률</span>
            <span class="summary-count" id="attendanceCount">0 / 0</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
        <input id="memberSearch" class="search-input" placeholder="이름 검색..." />
        <div class="member-list" id="memberList"></div>
        <div class="suggestion-section" style="margin-bottom:1rem;">
          <div class="date-label">건의사항 (선택)</div>
          <textarea class="suggestion-textarea" id="suggestionInput" placeholder="건의사항을 입력하세요"></textarea>
        </div>
        <div class="sticky-actions">
          <button type="button" class="save-button" id="saveBtn">출석 정보 저장</button>
          <div id="messageBox" class="hidden"></div>
        </div>
      </div>
    </div>

    <!-- 통계 탭 -->
    <div id="attStatsPanel" class="hidden">
      <div class="container">
        <div id="teamStatsLoading" class="hidden"><div class="message info">통계를 불러오는 중...</div></div>
        <div id="teamStatsSummary" class="hidden">
          <!-- 요약 카드 -->
          <div class="admin-summary" style="margin-bottom:1rem;">
            <div class="admin-summary-card">
              <div class="admin-summary-label">총 주차</div>
              <div class="admin-summary-value" id="tsWeeks">0</div>
            </div>
            <div class="admin-summary-card">
              <div class="admin-summary-label">평균 출석률</div>
              <div class="admin-summary-value" id="tsAvgRate">0%</div>
            </div>
            <div class="admin-summary-card">
              <div class="admin-summary-label">인원</div>
              <div class="admin-summary-value" id="tsMemberCount">0</div>
            </div>
          </div>

          <!-- 차트 1: 기간별 출석 인원 추이 (꺾은선) -->
          <div class="chart-card" style="margin-bottom:1rem;">
            <div style="font-weight:950; margin-bottom:0.75rem; color:#111827;">📅 기간별 출석 인원 추이</div>
            <div style="position:relative; height:160px;">
              <canvas id="teamAttendanceLineChart"></canvas>
            </div>
          </div>

          <!-- 차트 2: 방원별 출석률 (가로 막대) -->
          <div class="chart-card" style="margin-bottom:1rem;">
            <div style="font-weight:950; margin-bottom:0.75rem; color:#111827;">👥 방원별 출석률</div>
            <div style="position:relative; height:320px; overflow-y:auto;">
              <canvas id="teamMemberBarChart"></canvas>
            </div>
          </div>

          <!-- 방원별 상세 테이블 -->
          <div style="font-weight:950; color:#111827; margin-bottom:0.5rem;">📋 방원별 상세</div>
          <div class="attendance-table" id="teamStatsMemberTable" style="margin-bottom:2rem;"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="adminDashboard" class="hidden">
    <div class="header">
      <div class="header-content">
        <button type="button" class="back-button" id="adminBackBtn">← 홈으로</button>
        <h1>관리자 대시보드</h1>
      </div>
    </div>
    <div class="container">
      <div class="dashboard-tabs">
        <button class="tab-button active" data-tab="stats">출석 현황</button>
        <div class="tab-wrap">
          <button class="tab-button" data-tab="notes">특이사항</button>
          <span class="notif-badge" id="notesBadge" style="display:none;"></span>
        </div>
        <div class="tab-wrap">
          <button class="tab-button" data-tab="suggestions">건의사항</button>
          <span class="notif-badge" id="suggestionsBadge" style="display:none;"></span>
        </div>
        <button class="tab-button" data-tab="members">개인별 조회</button>
        <button class="tab-button" data-tab="allMembers">전체 인원</button>
      </div>

      <div id="adminStatsTab">
        <div class="date-section">
          <div class="date-label">날짜 확인</div>
          <input type="date" class="date-input" id="adminDateInput" />
        </div>
        <div class="admin-summary">
          <div class="admin-summary-card">
            <div class="admin-summary-label">출석</div>
            <div class="admin-summary-value" id="adminTotalPresent">0</div>
          </div>
          <div class="admin-summary-card">
            <div class="admin-summary-label">결석</div>
            <div class="admin-summary-value" id="adminTotalAbsent">0</div>
          </div>
          <div class="admin-summary-card">
            <div class="admin-summary-label">출석률</div>
            <div class="admin-summary-value" id="adminTotalRate">0%</div>
          </div>
        </div>
        <div class="attendance-table" id="attendanceTable"></div>
      </div>

      <div id="adminNotesTab" class="hidden">
        <div id="notesDateBar" class="hidden"></div>
        <div class="date-section">
           <div class="date-label">날짜 확인</div>
           <div class="date-row">
             <input type="date" class="date-input" id="adminNotesDateInput" />
             <button type="button" class="load-button" onclick="document.getElementById('adminNotesDateInput').value=today; loadAdminNotes();">오늘</button>
           </div>
        </div>
        <div class="attendance-table" id="notesTable" style="padding:1rem;"></div>
      </div>
      
      <div id="adminSuggestionsTab" class="hidden">
        <div id="suggestionsDateBar" class="hidden"></div>
        <div class="date-section">
           <div class="date-label">날짜 확인</div>
           <div class="date-row">
             <input type="date" class="date-input" id="adminSuggestionsDateInput" />
             <button type="button" class="load-button" onclick="document.getElementById('adminSuggestionsDateInput').value=today; loadAdminSuggestions();">오늘</button>
           </div>
        </div>
        <div class="attendance-table" id="suggestionsTable" style="padding:1rem;"></div>
      </div>

      <div id="adminMembersTab" class="hidden">
        <div class="date-section">
          <div class="date-label">기간 및 대상 설정</div>
          <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem;">
            <input type="date" class="date-input" id="memberStartDate" style="flex:1; width:auto;" />
            <input type="date" class="date-input" id="memberEndDate" style="flex:1; width:auto;" />
          </div>
          <input type="text" id="memberSearchInput" class="search-input" placeholder="🔍 이름 검색..." style="margin-bottom:0.5rem;" />
          <select class="date-input" id="memberSelect" style="margin-bottom:0.5rem;">
            <option value="">사람 선택</option>
          </select>
        </div>
        <div id="memberResultArea" class="hidden">
          <div class="admin-summary" style="grid-template-columns:repeat(3,1fr);">
            <div class="admin-summary-card">
              <div class="admin-summary-label">출석 횟수</div>
              <div class="admin-summary-value" id="memPresent">0</div>
            </div>
            <div class="admin-summary-card">
              <div class="admin-summary-label">총 횟수</div>
              <div class="admin-summary-value" id="memTotal">0</div>
            </div>
            <div class="admin-summary-card">
              <div class="admin-summary-label">출석률</div>
              <div class="admin-summary-value" id="memRate">0%</div>
            </div>
          </div>
          <div class="chart-card" style="margin-top:1rem;">

    function normalizeCohort(value) {

        // 한 자리 숫자(0~9)인 경우 앞에 0을 붙여 00~09로 정규화

    function jsonp(url, params) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Date.now() + Math.floor(Math.random()*1000);
        params.callback = cb;
        const query = Object.keys(params).map(k => encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
        const script = document.createElement("script");
        script.src = url + "?" + query;
        window[cb] = (data) => { delete window[cb]; document.body.removeChild(script); resolve(data); };
        script.onerror = () => { delete window[cb]; if(script.parentNode) document.body.removeChild(script); reject("Network Error"); };
        document.body.appendChild(script);
      });
    }

      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;

    async function loadServerAttendance() {
      showMsg("info", "데이터 불러오는 중...");
      try {
        const res = await jsonp(GOOGLE_SCRIPT_URL, { 
          action: "loadAttendance", teamId: selectedTeam.id, date: document.getElementById("dateInput").value 
        });
        
        // 1. 초기화
        const items = document.querySelectorAll(".member-item");
        items.forEach(el => {
          const key = el.dataset.key;
          attendance[key] = false;
          el.classList.remove("checked");
          el.querySelector(".note-input").value = "";
          memberNotes[key] = "";
        });
        document.getElementById("suggestionInput").value = "";

        // 2. 서버 데이터 매칭 및 복원
        if (res.status === "success" && res.data.found) {
          res.data.attendance.forEach(r => {
            const serverName = r.name.trim();
            const serverCohort = normalizeCohort(r.cohort);
            const key = serverName + "||" + serverCohort;
            
            if (attendance.hasOwnProperty(key)) {
              attendance[key] = r.isPresent;
              memberNotes[key] = r.note || "";
              const el = document.querySelector(`.member-item[data-key="${key.replace(/([ #;?%&,.+*~\':"!^$[\]()=>|/@])/g,'\\$1')}"]`);
              if (el) {
                if (r.isPresent) el.classList.add("checked");
                el.querySelector(".note-input").value = r.note || "";
              }
            }
          });
          document.getElementById("suggestionInput").value = res.data.suggestion || "";
          showMsg("success", "이전 데이터를 불러왔습니다.");
        } else {
          showMsg("info", "새로운 출석체크를 시작합니다.");
        }
        updateUI();
      } catch(e) { console.error(e); showMsg("error", "데이터 로드 실패"); }
    }

    async function loadAdminStats() {
      const date = document.getElementById("adminDateInput").value;
      const container = document.getElementById("attendanceTable");
      container.innerHTML = "<div class='message info'>로딩 중...</div>";
      const totalMembers = TEAMS.reduce((sum, team) => sum + team.members.length, 0);

      try {
        const res = await jsonp(GOOGLE_SCRIPT_URL, { action: "getStatsByDate", date });
        if(res.status !== "success") throw new Error();
        
        let html = `<table class="stats-table"><thead><tr><th>사랑방</th><th>총원</th><th>출석</th><th>결석</th><th>출석률</th></tr></thead><tbody>`;
        let tp=0; 
        const submittedData = res.data.teamStats; 

        TEAMS.forEach(team => {
          const stat = submittedData.find(s => String(s.teamId) === String(team.id));
          if (stat) {
            const present = Number(stat.present) || 0;
            const absent = Number(stat.absent) || 0; 
            const totalRecorded = present + absent; 
            const rate = totalRecorded ? Math.round(present/totalRecorded*100) : 0;
            tp += present; 
            
            html += `
              <tr class="team-row" onclick="toggleDetail(this, '${team.id}', '${date}')">
                <td><div class="team-name-cell"><span class="status-badge status-ok">제출</span>${team.name}</div></td>
                <td>${totalRecorded}</td>
                <td>${present}</td>
                <td>${absent}</td>
                <td>${rate}%</td>
              </tr>
              <tr class="detail-row hidden" id="detail-${team.id}">
                <td colspan="5"><div class="detail-panel" id="panel-${team.id}">로딩 중...</div></td>
              </tr>
            `;
          } else {
            html += `<tr class="team-row unsubmitted"><td><div class="team-name-cell"><span class="status-badge status-no">미제출</span>${team.name}</div></td><td>-</td><td>-</td><td>-</td><td>-</td></tr>`;
          }
        });

        html += "</tbody></table>";
        container.innerHTML = html;
        const overallRate = totalMembers ? Math.round(tp/totalMembers*100)+"%" : "0%";
        const totalAbsent = totalMembers - tp;
        document.getElementById("adminTotalPresent").textContent = tp;
        document.getElementById("adminTotalAbsent").textContent = totalAbsent; 
        document.getElementById("adminTotalRate").textContent = overallRate; 
      } catch(e) { container.innerHTML = "<div class='message error'>로딩 실패</div>"; }
    }

    function renderDateBar(barId, cache, inputId, loadFn) {
      const bar = document.getElementById(barId);
      const activeDates = Object.entries(cache)
        .filter(([, cnt]) => cnt > 0)
        .sort(([a], [b]) => a.localeCompare(b));
      if (activeDates.length === 0) { bar.classList.add("hidden"); return; }

      const currentVal = document.getElementById(inputId).value;
      const dayNames = ["일","월","화","수","목","금","토"];
      let html = `<div class="date-shortcut-bar">
        <span style="font-size:.8rem; font-weight:900; color:#6b7280; align-self:center; margin-right:.25rem;">📅 최근 업데이트</span>`;
      activeDates.forEach(([date, cnt]) => {
        const d = new Date(date + "T00:00:00");
        const mm = d.getMonth()+1, dd = d.getDate(), dow = dayNames[d.getDay()];
        const isActive = date === currentVal;
        html += `<button class="date-shortcut-btn${isActive?' active':''}"
          onclick="selectDateAndLoad('${date}','${inputId}', ${loadFn}, '${barId}', '${inputId}')">
          <span class="date-shortcut-dot" style="${isActive?'background:#fff':''}"></span>
          ${mm}/${dd}(${dow}) <span style="opacity:.75;">${cnt}건</span>
        </button>`;
      });
      html += `</div>`;
      bar.innerHTML = html;
      bar.classList.remove("hidden");
    }

        btn.classList.toggle("active", btn.textContent.trim().startsWith(

      });
      if (loadFnName === 'notes') loadAdminNotes();
      else loadAdminSuggestions();
    }

    async function checkBadge(action, badgeId, storageKey, dates, cache, barId, inputId, loadKey) {
      try {
        let lastSeen = "";
        try { lastSeen = localStorage.getItem(storageKey) || ""; } catch(e) {}
        let totalCount = 0;
        for (const date of dates) {
          const res = await jsonp(GOOGLE_SCRIPT_URL, { action, date });
          const cnt = (res.data && res.data.length) ? res.data.length : 0;
          cache[date] = cnt;
          if (date > lastSeen) totalCount += cnt;
        }
        const badge = document.getElementById(badgeId);
        if (totalCount > 0) {
          badge.textContent = totalCount > 99 ? "99+" : totalCount;
          badge.style.display = "flex";
        } else {
          badge.style.display = "none";
        }
        // 탭이 이미 열려 있으면 바 즉시 갱신
        renderDateBar(barId, cache, inputId, loadKey);
      } catch(e) {}
    }

    let memberTrendChartInstance = null;
    function renderTrendChart(sessions) {
      const ctx = document.getElementById("memberTrendChart").getContext("2d");
      if (memberTrendChartInstance) memberTrendChartInstance.destroy();

      const labels = sessions.map(s => s.date);
      const data   = sessions.map(s => s.isPresent ? 1 : 0);

      // 누적 출석률 수치로만 표시
      const presentCount = sessions.filter(s => s.isPresent).length;
      const cumRate = sessions.length ? Math.round(presentCount / sessions.length * 100) : 0;
      const badge = document.getElementById("cumRateBadge");
      if (badge) {
        const color = cumRate >= 80 ? '#15803d' : cumRate >= 50 ? '#b45309' : '#b91c1c';
        const bg    = cumRate >= 80 ? '#f0fdf4' : cumRate >= 50 ? '#fefce8' : '#fef2f2';
        badge.textContent = `누적 출석률: ${cumRate}%`;
        badge.style.color = color;
        badge.style.background = bg;
      }

      memberTrendChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: '출결',
            data,
            backgroundColor: data.map(v => v ? 'rgba(37,99,235,0.7)' : 'rgba(239,68,68,0.5)'),
            borderRadius: 3,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => ctx.raw === 1 ? '출석' : '결석'
              }
            }
          },
          scales: {
            x: { ticks: { maxTicksLimit: 12, font: { size: 10 } } },
            y: { min: 0, max: 1, ticks: { stepSize: 1, callback: v => v === 1 ? '출석' : v === 0 ? '결석' : '' } }
          }
        }
      });
    }

    function renderChart(monthlyData) {
      const ctx = document.getElementById("memberChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: monthlyData.map(d => d.month),
          datasets: [{
            label: '월별 출석률 (%)',
            data: monthlyData.map(d => parseFloat(d.rate)),
            backgroundColor: monthlyData.map(d => parseFloat(d.rate) >= 80 ? 'rgba(21,128,61,0.7)' : parseFloat(d.rate) >= 50 ? 'rgba(180,91,9,0.7)' : 'rgba(185,28,28,0.7)'),
            borderRadius: 5
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
        }
      });
    }
    // 사랑방 통계 탭
    let teamLineChartInstance = null;
    let teamBarChartInstance = null;
    let currentStatsTeam = null;

    async function loadTeamStats() {
      if (!currentStatsTeam) return;

      document.getElementById("teamStatsSummary").classList.add("hidden");
      document.getElementById("teamStatsLoading").classList.remove("hidden");

      try {
        const members = currentStatsTeam.members;

        // 모든 방원 이력 병렬 조회
        const results = await Promise.all(members.map(m => {
          const cohort = normalizeCohort(m.cohort);
          return jsonp(GOOGLE_SCRIPT_URL, { action: "getMemberHistory", name: m.name, cohort, startDate: "2000-01-01", endDate: today })
            .then(res => res.status === "success"
              ? { name: m.name, cohort, present: res.data.present, total: res.data.total, sessions: res.data.sessions || [], monthly: res.data.monthly || [] }
              : { name: m.name, cohort, present: 0, total: 0, sessions: [], monthly: [] })
            .catch(() => ({ name: m.name, cohort, present: 0, total: 0, sessions: [], monthly: [] }));
        }));

        // ── 요약 카드 ──
        const maxTotal = Math.max(...results.map(r => r.total || 0));
        const totalPresent = results.reduce((s, r) => s + (r.present || 0), 0);
        const totalSlots  = results.reduce((s, r) => s + (r.total  || 0), 0);
        const avgRate = totalSlots ? Math.round(totalPresent / totalSlots * 100) : 0;
        document.getElementById("tsWeeks").textContent = maxTotal + "회";
        document.getElementById("tsAvgRate").textContent = avgRate + "%";
        document.getElementById("tsMemberCount").textContent = members.length + "명";

        // ── 차트 1: 기간별 출석 인원 추이 (날짜별 출석자 수 꺾은선) ──
        // 모든 세션 날짜 수집
        const dateMap = {};
        results.forEach(r => {
          (r.sessions || []).forEach(s => {
            if (!dateMap[s.date]) dateMap[s.date] = 0;
            if (s.isPresent) dateMap[s.date]++;
          });
        });
        const sortedDates = Object.keys(dateMap).sort();
        const attendanceCounts = sortedDates.map(d => dateMap[d]);

        if (teamLineChartInstance) teamLineChartInstance.destroy();
        const lineCtx = document.getElementById("teamAttendanceLineChart").getContext("2d");
        teamLineChartInstance = new Chart(lineCtx, {
          type: 'line',
          data: {
            labels: sortedDates,
            datasets: [{
              label: '출석 인원 (명)',
              data: attendanceCounts,
              borderColor: '#2563eb',
              backgroundColor: 'rgba(37,99,235,0.1)',
              borderWidth: 2.5,
              pointBackgroundColor: '#2563eb',
              pointRadius: 4,
              tension: 0.3,
              fill: true,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { maxTicksLimit: 8, font: { size: 11 } } },
              y: { beginAtZero: true, max: members.length, ticks: { stepSize: 1 } }
            }
          }
        });

        // ── 차트 2: 방원별 출석률 (가로 막대) 출석률 낮은 순 정렬 ──
        const sortedByRate = [...results].sort((a, b) => {
          const rA = a.total ? a.present / a.total : 0;
          const rB = b.total ? b.present / b.total : 0;
          return rA - rB; // 낮은 사람이 위로 (차트 특성상 아래가 먼저 나오므로)
        });
        const barLabels = sortedByRate.map(r => r.name);
        const barRates  = sortedByRate.map(r => r.total ? Math.round(r.present / r.total * 100) : 0);
        const barColors = barRates.map(rate =>
          rate >= 80 ? 'rgba(21,128,61,0.8)' : rate >= 50 ? 'rgba(180,91,9,0.8)' : 'rgba(185,28,28,0.8)'
        );

        if (teamBarChartInstance) teamBarChartInstance.destroy();
        const barCtx = document.getElementById("teamMemberBarChart").getContext("2d");
        const barH = Math.min(Math.max(members.length * 26, 160), 360);
        barCtx.canvas.parentNode.style.height = barH + "px";
        teamBarChartInstance = new Chart(barCtx, {
          type: 'bar',
          data: {
            labels: barLabels,
            datasets: [{
              label: '출석률 (%)',
              data: barRates,
              backgroundColor: barColors,
              borderRadius: 4,
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: { label: ctx => ` ${ctx.raw}%  (${sortedByRate[ctx.dataIndex].present}/${sortedByRate[ctx.dataIndex].total}회)` }
              }
            },
            scales: {
              x: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } },
              y: { ticks: { font: { size: 12, weight: 'bold' } } }
            }
          }
        });

        // ── 방원별 상세 테이블 (출석률 높은 순) ──
        const sortedDesc = [...results].sort((a, b) => (b.present/(b.total||1)) - (a.present/(a.total||1)));
        let html = `<table><thead><tr><th>이름</th><th>또래</th><th>출석</th><th>총 주차</th><th>출석률</th></tr></thead><tbody>`;
        sortedDesc.forEach(r => {
          const rate = r.total ? Math.round(r.present / r.total * 100) : 0;
          const color = rate >= 80 ? '#15803d' : rate >= 50 ? '#b45309' : '#b91c1c';
          html += `<tr><td><strong>${r.name}</strong></td><td>${r.cohort} 또래</td><td>${r.present}</td><td>${r.total}</td><td style="color:${color}; font-weight:bold;">${rate}%</td></tr>`;
        });
        html += "</tbody></table>";
        document.getElementById("teamStatsMemberTable").innerHTML = html;

        document.getElementById("teamStatsLoading").classList.add("hidden");
        document.getElementById("teamStatsSummary").classList.remove("hidden");
      } catch(e) {
        console.error(e);
        document.getElementById("teamStatsLoading").innerHTML = "<div class='message error'>로딩 실패</div>";
      }
    };

    // 날짜 초기화 (teamStats)
    // 전체 인원 탭 날짜 초기화
    document.getElementById("allStartDate").value = oneYearAgo;
    document.getElementById("allEndDate").value = today;

    // 전체 인원 통계 불러오기
    let allMembersData = [];
    document.getElementById("viewAllStatsBtn").onclick = async () => {
      const startDate = document.getElementById("allStartDate").value;
      const endDate   = document.getElementById("allEndDate").value;
      if (!startDate || !endDate) { alert("기간을 모두 선택해주세요."); return; }

      const btn = document.getElementById("viewAllStatsBtn");
      btn.disabled = true;
      btn.textContent = "불러오는 중...";

      document.getElementById("allMembersStatsArea").classList.add("hidden");
      document.getElementById("allMembersLoading").classList.remove("hidden");
      document.getElementById("allMembersLoadingMsg").textContent = "전체 인원 통계를 불러오는 중입니다...";
      document.getElementById("allTotalMembers").textContent = "-";
      document.getElementById("allAvgRate").textContent = "-";

      try {
        const allMembers = TEAMS.flatMap((t, ti) => t.members.map((m, mi) => ({
          name: m.name, cohort: normalizeCohort(m.cohort),
          teamName: t.name, teamOrder: ti, memberOrder: mi
        })));

        const batchSize = 5;
        const results = [];
        for (let i = 0; i < allMembers.length; i += batchSize) {
          const batch = allMembers.slice(i, i + batchSize);
          const batchResults = await Promise.all(batch.map(m =>
            jsonp(GOOGLE_SCRIPT_URL, { action: "getMemberHistory", name: m.name, cohort: m.cohort, startDate, endDate })
              .then(res => res.status === "success"
                ? { ...m, present: res.data.present, total: res.data.total, sessions: res.data.sessions || [] }
                : { ...m, present: 0, total: 0, sessions: [] })
              .catch(() => ({ ...m, present: 0, total: 0, sessions: [] }))
          ));
          results.push(...batchResults);
          const pct = Math.min(Math.round((i + batchSize) / allMembers.length * 100), 99);
          document.getElementById("allMembersLoadingMsg").textContent = `전체 인원 통계를 불러오는 중... (${pct}%)`;
        }

        results.sort((a, b) => a.teamOrder !== b.teamOrder ? a.teamOrder - b.teamOrder : a.memberOrder - b.memberOrder);
        allMembersData = results;

        const totalSlots   = results.reduce((s, r) => s + r.total, 0);
        const totalPresent = results.reduce((s, r) => s + r.present, 0);
        const avgRate = totalSlots ? Math.round(totalPresent / totalSlots * 100) : 0;
        document.getElementById("allTotalMembers").textContent = allMembers.length + "명";
        document.getElementById("allAvgRate").textContent = avgRate + "%";

        renderAllMembersTable(results);
        document.getElementById("allMembersLoading").classList.add("hidden");
        document.getElementById("allMembersStatsArea").classList.remove("hidden");
      } catch(e) {
        document.getElementById("allMembersLoadingMsg").textContent = "로딩 실패. 다시 시도해주세요.";
      } finally {
        btn.disabled = false;
        btn.textContent = "📋 통계 불러오기";
      }
    };

    // 개인별 조회 이름 검색
    document.getElementById("memberSearchInput").addEventListener("input", function() {
      const q = this.value.trim().toLowerCase();
      const sel = document.getElementById("memberSelect");
      let firstMatch = null;
      Array.from(sel.options).forEach(opt => {
        if (!opt.value) return;
        const show = opt.text.toLowerCase().includes(q);
        opt.style.display = show ? "" : "none";
        if (show && !firstMatch) firstMatch = opt;
      });
      if (q && firstMatch) {
        sel.value = firstMatch.value;
        sel.dispatchEvent(new Event("change"));
      } else if (!q) {
        sel.value = "";
        document.getElementById("memberResultArea").classList.add("hidden");
      }
    });

    function renderAllMembersTable(results) {
      let html = `<table><thead><tr><th>사랑방</th><th>이름</th><th>또래</th><th>출석</th><th>총 횟수</th><th>출석률</th></tr></thead><tbody>`;
      results.forEach((r, idx) => {
        const rate = r.total ? Math.round(r.present / r.total * 100) : 0;
        const color = rate >= 80 ? '#15803d' : rate >= 50 ? '#b45309' : '#b91c1c';
        html += `
          <tr style="cursor:pointer;" onclick="toggleAllMemberDetail(${idx}, this)">
            <td style="font-size:0.8rem;">${r.teamName}</td>
            <td><strong>${r.name}</strong></td>
            <td>${r.cohort}</td>
            <td>${r.present}</td>
            <td>${r.total}</td>
            <td style="color:${color}; font-weight:bold;">${rate}%</td>
          </tr>
          <tr id="allDetail-${idx}" class="hidden" style="background:#f9fafb;">
            <td colspan="6" style="padding:0.75rem 1rem; white-space:normal;">
              <div id="allDetailContent-${idx}"></div>
            </td>
          </tr>`;
      });
      html += "</tbody></table>";
      document.getElementById("allMembersTableContainer").innerHTML = html;
    }

    function toggleAllMemberDetail(idx, row) {
      const detailRow = document.getElementById(`allDetail-${idx}`);
      const content = document.getElementById(`allDetailContent-${idx}`);
      const isHidden = detailRow.classList.contains("hidden");
      // 다른 열린 것 닫기
      document.querySelectorAll('[id^="allDetail-"]').forEach(el => {
        if (el.id !== `allDetail-${idx}`) {
          el.classList.add("hidden");
          // 이전에 열린 행 배경 초기화
          const prevRow = el.previousElementSibling;
          if (prevRow) prevRow.style.background = "";
        }
      });
      if (isHidden) {
        detailRow.classList.remove("hidden");
        row.style.background = "#eff6ff";
        const r = allMembersData[idx];
        if (!r.sessions || r.sessions.length === 0) {
          content.innerHTML = "<span style='color:#6b7280; font-size:0.85rem;'>기록 없음</span>";
          return;
        }
        // 월별로 그룹화
        const monthGroups = {};
        r.sessions.forEach(s => {
          const month = s.date.slice(0, 7); // "2025-03"
          if (!monthGroups[month]) monthGroups[month] = [];
          monthGroups[month].push(s);
        });
        let html = "";
        Object.keys(monthGroups).sort().forEach(month => {
          const sessions = monthGroups[month];
          const presentCount = sessions.filter(s => s.isPresent).length;
          html += `<div style="margin-bottom:0.75rem;">
            <div style="font-size:0.8rem; font-weight:900; color:#374151; margin-bottom:0.35rem;">
              ${month} <span style="font-weight:500; color:#6b7280;">(${presentCount}/${sessions.length})</span>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:0.3rem;">`;
          sessions.forEach(s => {
            const day = s.date.slice(8); // "03"
            const bg  = s.isPresent ? '#2563eb' : '#fee2e2';
            const fc  = s.isPresent ? '#fff'    : '#b91c1c';
            const border = s.isPresent ? '#2563eb' : '#fca5a5';
            html += `<div title="${s.date} ${s.isPresent ? '출석' : '결석'}"
              style="width:2rem; height:2rem; border-radius:6px; background:${bg}; color:${fc};
                     border:1px solid ${border}; display:flex; align-items:center; justify-content:center;
                     font-size:0.75rem; font-weight:700;">
              ${day}
            </div>`;
          });
          html += `</div></div>`;
        });
        // 범례
        html += `<div style="display:flex; gap:0.75rem; margin-top:0.5rem; font-size:0.75rem; color:#6b7280; align-items:center;">
          <span><span style="display:inline-block;width:0.8rem;height:0.8rem;background:#2563eb;border-radius:3px;vertical-align:middle;margin-right:3px;"></span>출석</span>
          <span><span style="display:inline-block;width:0.8rem;height:0.8rem;background:#fee2e2;border:1px solid #fca5a5;border-radius:3px;vertical-align:middle;margin-right:3px;"></span>결석</span>
        </div>`;
        content.innerHTML = html;
      } else {
        detailRow.classList.add("hidden");
        row.style.background = "";
      }
    }
    // 전체 인원 통계 엑셀 저장 (설정된 기간 기반)
    document.getElementById("saveAllToSheetBtn").onclick = async () => {
      const btn = document.getElementById("saveAllToSheetBtn");
      const startDate = document.getElementById("allStartDate").value;
      const endDate   = document.getElementById("allEndDate").value;
      if (!startDate || !endDate) { alert("기간을 먼저 설정해주세요."); return; }

      if (!confirm(`${startDate} ~ ${endDate}\n전체 인원(${TEAMS.reduce((s,t)=>s+t.members.length,0)}명)의 출석 통계를\n엑셀 파일로 저장하시겠습니까?\n\n※ 데이터 수집에 수 분이 걸릴 수 있습니다.`)) return;

      btn.disabled = true;
      btn.textContent = "데이터 수집 중... (0%)";

      try {
        const allMembers = TEAMS.flatMap((t, ti) => t.members.map((m, mi) => ({
          name: m.name,
          cohort: normalizeCohort(m.cohort),
          teamName: t.name,
          teamOrder: ti,
          memberOrder: mi
        })));

        const batchSize = 5;
        const results = [];
        for (let i = 0; i < allMembers.length; i += batchSize) {
          const batch = allMembers.slice(i, i + batchSize);
          const batchResults = await Promise.all(batch.map(m =>
            jsonp(GOOGLE_SCRIPT_URL, { action: "getMemberHistory", name: m.name, cohort: m.cohort, startDate, endDate })
              .then(res => res.status === "success"
                ? { ...m, present: res.data.present, total: res.data.total }
                : { ...m, present: 0, total: 0 })
              .catch(() => ({ ...m, present: 0, total: 0 }))
          ));
          results.push(...batchResults);
          btn.textContent = `데이터 수집 중... (${Math.min(Math.round((i + batchSize) / allMembers.length * 100), 99)}%)`;
        }

        // TEAMS 순서 정렬
        results.sort((a, b) => a.teamOrder !== b.teamOrder ? a.teamOrder - b.teamOrder : a.memberOrder - b.memberOrder);

        btn.textContent = "엑셀 생성 중...";

        // SheetJS로 엑셀 생성
        const wsData = [
          [`출석 통계 (${startDate} ~ ${endDate})`],
          [],
          ["사랑방", "이름", "또래", "출석 횟수", "총 횟수", "출석률(%)"],
          ...results.map(r => {
            const rate = r.total ? Math.round(r.present / r.total * 100) : 0;
            return [r.teamName, r.name, r.cohort, r.present, r.total, rate];
          })
        ];

        const ws = XLSX.utils.aoa_to_sheet(wsData);
        // 컬럼 너비 설정
        ws['!cols'] = [{ wch: 18 }, { wch: 12 }, { wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 12 }];
        // 제목 병합
        ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } }];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "출석통계");
        XLSX.writeFile(wb, `출석통계_${startDate}_${endDate}.xlsx`);

        alert(`✅ 엑셀 저장 완료!\n${results.length}명의 데이터가 저장되었습니다.`);
      } catch(e) {
        console.error(e);
        alert("저장 중 오류가 발생했습니다.");
      } finally {
        btn.disabled = false;
        btn.textContent = "📥 전체 인원 통계 엑셀 저장";
      }
    };
  </script>
</body>
</html>
